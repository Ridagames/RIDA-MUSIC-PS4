name: Build RGS MUSIC PS4

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RGS MUSIC
        uses: actions/checkout@v4

      - name: Checkout OpenOrbis sample graphics helpers
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          path: tools/openorbis-source

      - name: Install official graphics helper sources
        run: |
          cp tools/openorbis-source/samples/_common/graphics.h src/graphics.h
          cp tools/openorbis-source/samples/_common/graphics.cpp src/graphics.cpp
          cp tools/openorbis-source/samples/_common/log.h src/log.h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install icon generator dependency
        run: python -m pip install --upgrade Pillow

      - name: Generate application icon
        run: python tools/make_icon.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Checkout OpenOrbis create-fself
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-fself
          path: tools/create-fself

      - name: Checkout OpenOrbis create-gp4
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-gp4
          path: tools/create-gp4

      - name: Build OpenOrbis helper tools
        run: |
          set -e
          mkdir -p tools/bin
          cd tools/create-fself/cmd/create-fself
          go build -o "$GITHUB_WORKSPACE/tools/bin/create-fself" -modfile=go-linux.mod
          cd "$GITHUB_WORKSPACE/tools/create-gp4/cmd/create-gp4"
          go build -o "$GITHUB_WORKSPACE/tools/bin/create-gp4" .

      - name: Build and independently inspect PS4 package
        run: |
          set -e
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc '
              set -e
              : "${OO_PS4_TOOLCHAIN:?OO_PS4_TOOLCHAIN is not set}"
              mkdir -p "$OO_PS4_TOOLCHAIN/bin/linux" sce_sys/about /workspace/audit_pkg
              install -m 755 /workspace/tools/bin/create-fself "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
              install -m 755 /workspace/tools/bin/create-gp4 "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
              RIGHT_SPRX="$(find "$OO_PS4_TOOLCHAIN" -name right.sprx -print -quit)"
              if [ -z "$RIGHT_SPRX" ]; then echo "OpenOrbis right.sprx was not found"; exit 1; fi
              cp "$RIGHT_SPRX" sce_sys/about/right.sprx
              make
              PKG_FILE="$(find /workspace -maxdepth 1 -name "*.pkg" -print -quit)"
              test -n "$PKG_FILE"
              echo "=== PKG cryptographic/hash validation ==="
              "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_validate --verbose "$PKG_FILE"
              echo "=== Extracting the actual installed SFO from the PKG ==="
              "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_extract --verbose "$PKG_FILE" /workspace/audit_pkg
            '

      - name: Audit SELF header, fake-signature block and SFO metadata
        run: |
          python tools/validate_package.py \
            --eboot eboot.bin \
            --sfo sce_sys/param.sfo \
            --packaged-sfo audit_pkg/sce_sys/param.sfo

      - name: Upload validated PKG
        uses: actions/upload-artifact@v4
        with:
          name: RGS-MUSIC-PS4-PKG
          path: '*.pkg'
          if-no-files-found: error
          retention-days: 14
