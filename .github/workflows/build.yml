name: Build RIDA MUSIC PS4

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install icon generator dependency
        run: python -m pip install --upgrade Pillow

      - name: Generate application icon
        run: python tools/make_icon.py

      - name: Build PS4 PKG with official OpenOrbis Docker image
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc '
              set -e
              : "${OO_PS4_TOOLCHAIN:?OO_PS4_TOOLCHAIN is not set in the OpenOrbis image}"
              mkdir -p sce_sys/about
              RIGHT_SPRX="$(find "$OO_PS4_TOOLCHAIN" -name right.sprx -print -quit)"
              if [ -z "$RIGHT_SPRX" ]; then
                echo "OpenOrbis right.sprx was not found"
                exit 1
              fi
              cp "$RIGHT_SPRX" sce_sys/about/right.sprx
              make
            '

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: RIDA-MUSIC-PS4-PKG
          path: '*.pkg'
          if-no-files-found: error
          retention-days: 14
